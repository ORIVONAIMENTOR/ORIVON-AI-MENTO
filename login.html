<script>
/* === Orivon message system helpers (om-) === */
window.OrivonMsg = (function(){
  let stack;
  function getStack(){
    if (!stack){
      stack = document.createElement('div');
      stack.className = 'om-toast-stack';
      document.body.appendChild(stack);
    }
    return stack;
  }
  const ICONS = { error:'⚠', warn:'⚠', ok:'✓' };

  function toast(opts){
    if (typeof opts === 'string') opts = { title: opts };
    const type = opts.type || 'error';
    const title = opts.title || 'Something went wrong';
    const body = opts.body || '';
    const el = document.createElement('div');
    el.className = 'om-toast' + (type === 'warn' ? ' om-warn' : type === 'ok' ? ' om-ok' : '');
    el.innerHTML = '<span class="om-icon">' + (ICONS[type] || ICONS.error) + '</span>' +
      '<div class="om-body"><strong></strong>' + (body ? '<span></span>' : '') + '</div>';
    el.querySelector('strong').textContent = title;
    if (body) el.querySelector('span').textContent = body;
    getStack().appendChild(el);
    requestAnimationFrame(() => el.classList.add('om-show'));
    setTimeout(() => {
      el.classList.remove('om-show');
      setTimeout(() => el.remove(), 250);
    }, opts.duration || 5000);
  }

  function banner(container, opts){
    container.innerHTML = '<div class="om-banner"><span>⚠</span><div><strong></strong> <span></span></div></div>';
    container.querySelector('strong').textContent = opts.title || "We couldn't process that.";
    container.querySelector('.om-banner span:last-child').textContent = opts.body || 'Please try again.';
    container.style.display = '';
  }

  function empty(container, opts){
    container.innerHTML = '<div class="om-empty"><div class="om-glyph">' + (opts.glyph || '◆') + '</div>' +
      '<h3></h3><p></p>' + (opts.actionLabel ? '<button type="button"></button>' : '') + '</div>';
    container.querySelector('h3').textContent = opts.title || 'Nothing here yet';
    container.querySelector('p').textContent = opts.body || '';
    if (opts.actionLabel){
      const btn = container.querySelector('button');
      btn.textContent = opts.actionLabel;
      if (opts.onAction) btn.addEventListener('click', opts.onAction);
    }
  }

  function retry(container, opts){
    container.innerHTML = '<div class="om-retry"><div class="om-glyph">!</div>' +
      '<h3></h3><p></p><button type="button"></button></div>';
    container.querySelector('h3').textContent = opts.title || "Couldn't load this";
    container.querySelector('p').textContent = opts.body || 'Something went wrong on our end. Give it another try.';
    const btn = container.querySelector('button');
    btn.textContent = opts.actionLabel || 'Retry';
    if (opts.onRetry) btn.addEventListener('click', opts.onRetry);
  }

  function skeleton(container, lines){
    lines = lines || [90, 60, 40];
    container.innerHTML = '<div class="om-skeleton">' +
      lines.map(w => '<div class="om-sk-line" style="width:' + w + '%"></div>').join('') +
      '</div>';
  }

  function wait(container, message){
    container.innerHTML = '<div class="om-wait"><div class="om-spinner"></div><span></span></div>';
    container.querySelector('span').textContent = message || 'Working on it…';
  }

  function timeout(container, opts){
    container.innerHTML = '<div class="om-timeout"><span>⏱</span><div><strong></strong> <span></span></div></div>';
    container.querySelector('strong').textContent = opts.title || 'This is taking longer than usual.';
    container.querySelector('.om-timeout span:last-child').textContent = opts.body || 'Still working on it — you can wait, or try again in a moment.';
  }

  return { toast, banner, empty, retry, skeleton, wait, timeout };
})();
</script>

    </form>

    <div class="auth-footer">
      Don't have an account? <a class="link-purple" href="register.html">Sign up free</a>
    </div>
  </div>
</div>

<script>
  // Theme toggle (light/dark)
  function setTheme(mode){
    document.documentElement.setAttribute('data-theme', mode);
    document.querySelectorAll('.theme-toggle .knob').forEach(k => k.textContent = mode === 'light' ? '☀️' : '🌙');
  }
  document.getElementById('themeToggle').addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    setTheme(current === 'light' ? 'dark' : 'light');
  });

  // Settings popover — toggle only visible after pressing Settings
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsPopover = document.getElementById('settingsPopover');
  settingsBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    settingsPopover.classList.toggle('show');
  });
  document.addEventListener('click', (e) => {
    if(!settingsPopover.contains(e.target) && e.target !== settingsBtn){
      settingsPopover.classList.remove('show');
    }
  });
  document.addEventListener('keydown', e => { if(e.key === 'Escape') settingsPopover.classList.remove('show'); });
  const form = document.getElementById('loginForm');
  const emailInput = document.getElementById('loginEmail');
  const passwordInput = document.getElementById('loginPassword');
  const emailError = document.getElementById('loginEmailError');
  const passwordError = document.getElementById('loginPasswordError');
  const submitBtn = document.getElementById('loginSubmit');
  const banner = document.getElementById('formBanner');

  function isValidEmail(value){
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value.trim());
  }

  function setFieldState(input, errorEl, valid){
    input.classList.toggle('error', !valid);
    errorEl.classList.toggle('show', !valid);
  }

  function showBanner(message, type){
    banner.textContent = message;
    banner.className = 'form-banner show ' + type;
  }

  // Toggle password visibility
  document.querySelectorAll('.toggle-visibility').forEach(btn => {
    btn.addEventListener('click', () => {
      const target = document.getElementById(btn.dataset.target);
      const isPassword = target.type === 'password';
      target.type = isPassword ? 'text' : 'password';
      btn.textContent = isPassword ? 'Hide' : 'Show';
    });
  });

  // Live validation
  emailInput.addEventListener('blur', () => {
    setFieldState(emailInput, emailError, emailInput.value.trim() !== '' && isValidEmail(emailInput.value));
  });
  passwordInput.addEventListener('blur', () => {
    setFieldState(passwordInput, passwordError, passwordInput.value.trim() !== '');
  });
  emailInput.addEventListener('input', () => { if(emailInput.classList.contains('error')) setFieldState(emailInput, emailError, isValidEmail(emailInput.value)); });
  passwordInput.addEventListener('input', () => { if(passwordInput.classList.contains('error')) setFieldState(passwordInput, passwordError, passwordInput.value.trim() !== ''); });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    banner.classList.remove('show');

    const emailValid = isValidEmail(emailInput.value);
    const passwordValid = passwordInput.value.trim() !== '';

    setFieldState(emailInput, emailError, emailValid);
    setFieldState(passwordInput, passwordError, passwordValid);

    if(!emailValid || !passwordValid){
      showBanner('Please fix the highlighted fields before continuing.', 'error');
      return;
    }

    submitBtn.classList.add('loading');
    submitBtn.disabled = true;

    try{
      const { data, error } = await window._sb.auth.signInWithPassword({
        email: emailInput.value.trim(),
        password: passwordInput.value
      });

      submitBtn.classList.remove('loading');
      submitBtn.disabled = false;

      if(error){
        showBanner(error.message || 'Could not log in. Please check your credentials.', 'error');
        return;
      }

      showBanner('Logged in successfully. Redirecting…', 'success');
      setTimeout(() => {
        window.location.href = 'profile.html';
      }, 700);
    }catch(err){
      submitBtn.classList.remove('loading');
      submitBtn.disabled = false;
      showBanner('Something went wrong. Please try again.', 'error');
    }
  });

  document.getElementById('forgotLink').addEventListener('click', async (e) => {
    e.preventDefault();
    const email = emailInput.value.trim();
    if(!isValidEmail(email)){
      setFieldState(emailInput, emailError, false);
      showBanner('Enter your email above first, then click "Forgot password?" again.', 'error');
      return;
    }
    const { error } = await window._sb.auth.resetPasswordForEmail(email);
    if(error){
      showBanner(error.message, 'error');
    }else{
      showBanner("If an account exists for that email, we've sent a reset link.", 'success');
    }
  });

  ['googleBtn','githubBtn'].forEach(id => {
    document.getElementById(id).addEventListener('click', () => {
      showBanner('Social login isn\'t connected yet — wire this up to your auth provider.', 'error');
    });
  });
</script>
</body>
</html>
